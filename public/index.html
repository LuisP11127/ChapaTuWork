<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChapaTuWork</title>
  <meta name="description" content="ChapaTuWork: muy pronto en línea.">
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1b1b1b;
      --muted: #5c5c5c;
      --accent: #e8590c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141414;
        --fg: #f2f2f2;
        --muted: #a3a3a3;
        --accent: #ff8a3d;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.2rem, 8vw, 4rem);
      letter-spacing: -0.02em;
    }
    h1 span { color: var(--accent); }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Chapa<span>Tu</span>Work</h1>
    <p>Muy pronto en línea.</p>
  </main>
</body>
</html>
